# cargo-deny configuration — run locally with `cargo deny check all`.
# CI runs the same check in the "Supply chain" job of .github/workflows/ci.yml.

[graph]
all-features = true

[advisories]
# Fail on any crate with a security advisory or an unmaintained warning.
# Add an entry here only with a comment explaining the exposure and the plan.
ignore = []

[licenses]
# Licenses accepted for this workspace and its dependencies. Keep GPL-3.0-only
# for the crates themselves; the remaining entries cover compatible dependency
# licenses commonly encountered by Rust projects.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    # The OpenHuman-ecosystem crates (`tinyjuice` and one sibling) are
    # `GPL-3.0-or-later`, which is compatible with this workspace's
    # `GPL-3.0-only`.
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    # MIT No Attribution: MIT without the notice requirement. OSI approved and
    # GPL-3.0 compatible; `borrow-or-share` uses it, reached through `jsonschema`.
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat build times; review them rather than ignoring them.
multiple-versions = "warn"
wildcards = "deny"
# A `version` requirement on a workspace-internal path dependency is a trap: it
# is a caret range, so the first minor bump past `0.1.x` — or any 1.0 release —
# stops resolving, and the release workflow discovers it after the tag is
# pushed. The path is the whole address for a crate that is never published, so
# those entries carry no version and are wildcards by construction.
#
# This exemption is narrow: it applies only to path dependencies on crates whose
# manifest sets `publish = false`. A wildcard on anything from a registry is
# still denied, which is what this check exists for.
allow-wildcard-paths = true
# `tinyjuice` is vendored inside OpenHuman. Its manifest carries no
# `publish = false`, so `allow-wildcard-paths` does not reach it: cargo-deny reads
# its internal git dependency on `tinytools` as a wildcard even though nothing
# resolves through a range, because the whole tree is revision-pinned and
# `.github/scripts/assert-openhuman-pin.sh` holds it to the recorded submodule.
# This skips that one package's manifest-level wildcard finding only; its
# dependency tree stays subject to every other ban.
skip = [{ name = "tinyjuice", version = "0.6.0" }]
# Crates that must never enter the dependency graph.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
